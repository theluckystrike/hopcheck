[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hopcheck"
version = "0.1.0"
description = "Walk a redirect chain one hop at a time and report what each hop actually did."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Michal Lip" }]
keywords = ["redirect", "http", "seo", "301", "audit", "links", "meta refresh"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Documentation = "https://hopcheck.readthedocs.io/"
Source = "https://github.com/theluckystrike/hopcheck"

[project.scripts]
hopcheck = "hopcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
